<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4HRS Procurement</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f3f5f7;
    color: #202124;
}

header {
    background: #17212b;
    color: white;
    padding: 26px 40px;
}

header h1 {
    margin: 0;
}

header p {
    margin: 6px 0 0;
    color: #b8c0c8;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 24px 40px 0;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.stat .number {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
}

main {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 24px;
    padding: 24px 40px 40px;
}

.card {
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    margin-top: 6px;
    padding: 11px;
    border: 1px solid #ccd1d5;
    border-radius: 7px;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit {
    margin-top: 22px;
    width: 100%;
    background: #2167d5;
    color: white;
}

.request {
    padding: 18px 0;
    border-bottom: 1px solid #e5e7eb;
}

.request:last-child {
    border-bottom: 0;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.meta {
    color: #667085;
    margin-top: 6px;
}

.amount {
    float: right;
    font-weight: bold;
    font-size: 17px;
}

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 11px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: bold;
}

.PENDING {
    background: #fff3cd;
    color: #856404;
}

.APPROVED {
    background: #d9f7e5;
    color: #176b38;
}

.REJECTED {
    background: #fde2e2;
    color: #9c1c1c;
}

.actions {
    margin-top: 12px;
}

.approve {
    background: #238636;
    color: white;
    margin-right: 8px;
}

.reject {
    background: #c62828;
    color: white;
}

.empty {
    color: #777;
    padding: 20px 0;
}

@media (max-width: 800px) {
    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

    main {
        grid-template-columns: 1fr;
    }
}

/* =========================================================
   P03 Dashboard Enhancement
   ========================================================= */

.insights {
    width: min(1120px, calc(100% - 40px));
    margin: 0 auto 24px;
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
    gap: 20px;
}

.insight-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    border: 1px solid #eef2f7;
}

.insight-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
}

.insight-heading h2 {
    margin: 0;
    font-size: 20px;
}

.insight-subtitle {
    margin-top: 5px;
    color: #64748b;
    font-size: 13px;
}

.live-pill {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-radius: 999px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 12px;
    font-weight: 700;
}

.growth-bars {
    height: 185px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
}

.growth-col {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    text-align: center;
}

.growth-value {
    min-height: 28px;
    margin-bottom: 6px;
    color: #475569;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.growth-track {
    height: 125px;
    display: flex;
    align-items: flex-end;
    padding: 0 4px;
    background: linear-gradient(
        180deg,
        rgba(239, 246, 255, 0.15),
        rgba(239, 246, 255, 0.80)
    );
    border-radius: 10px;
}

.growth-bar {
    width: 100%;
    min-height: 8px;
    border-radius: 8px 8px 4px 4px;
    background: linear-gradient(
        180deg,
        #60a5fa 0%,
        #2563eb 100%
    );
    transition:
        height 0.35s ease,
        transform 0.2s ease;
}

.growth-col:hover .growth-bar {
    transform: translateY(-3px);
}

/* P03-R5 - sparse dataset presentation */
.growth-bars.sparse {
    justify-content: center;
}

.growth-bars.sparse .growth-col {
    flex: 0 1 140px;
    max-width: 140px;
}

.growth-bars.sparse .growth-track {
    width: 100%;
}
.growth-label {
    margin-top: 7px;
    color: #64748b;
    font-size: 11px;
}

.growth-empty,
.recent-empty {
    color: #94a3b8;
    font-size: 14px;
    padding: 24px 0;
}

.recent-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.recent-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #f1f5f9;
}

.recent-row:last-child {
    border-bottom: none;
}

.recent-main {
    min-width: 0;
}

.recent-title {
    color: #0f172a;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.recent-meta {
    margin-top: 3px;
    color: #64748b;
    font-size: 12px;
}

.recent-badge {
    flex: 0 0 auto;
    padding: 5px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.2px;
}

.recent-badge.PENDING {
    background: #fff7ed;
    color: #c2410c;
}

.recent-badge.APPROVED {
    background: #ecfdf5;
    color: #047857;
}

.recent-badge.REJECTED {
    background: #fef2f2;
    color: #b91c1c;
}

@media (max-width: 820px) {
    .insights {
        grid-template-columns: 1fr;
    }

    .growth-bars {
        gap: 6px;
    }

    .growth-value {
        font-size: 10px;
    }
}
</style>
</head>

<body>

<header>
<h1>4HRS Procurement</h1>
<p>採購申請管理系統</p>
</header>

<section class="dashboard">

<div class="stat">
    <div>總申請</div>
    <div id="total" class="number">0</div>
</div>

<div class="stat">
    <div>待審核</div>
    <div id="pending" class="number">0</div>
</div>

<div class="stat">
    <div>已核准</div>
    <div id="approved" class="number">0</div>
</div>

<div class="stat">
    <div>已駁回</div>
    <div id="rejected" class="number">0</div>
</div>

</section>

<section class="insights">

    <section class="insight-card">

        <div class="insight-heading">
            <div>
                <h2>Request Growth</h2>
                <div id="growth-subtitle"
                     class="insight-subtitle">
                    讀取申請資料中...
                </div>
            </div>

            <div class="live-pill">
                LIVE DATA
            </div>
        </div>

        <div id="growth-bars"
             class="growth-bars">
            <div class="growth-empty">
                載入資料中...
            </div>
        </div>

    </section>

    <section class="insight-card">

        <div class="insight-heading">
            <div>
                <h2>Recent Requests</h2>
                <div class="insight-subtitle">
                    最近 5 筆採購申請
                </div>
            </div>
        </div>

        <div id="recent-requests"
             class="recent-list">
            <div class="recent-empty">
                載入資料中...
            </div>
        </div>

    </section>

</section>

<main>

<section class="card">

<h2>新增採購申請</h2>

<form id="form">

<label>申請人</label>
<input id="applicant" value="Austin" required>

<label>採購品項</label>
<input id="item_name"
       placeholder="例如：VAIO F14 32GB"
       required>

<label>數量</label>
<input id="quantity"
       type="number"
       value="1"
       min="1"
       required>

<label>單價</label>
<input id="unit_price"
       type="number"
       placeholder="46999"
       min="1"
       required>

<button class="submit" type="submit">
建立採購申請
</button>

</form>

</section>

<section class="card">

<h2>採購申請</h2>

<div id="requests">
載入中...
</div>

</section>

</main>

<script>

function escapeHtml(value) {

    return String(value ?? '')
        .replace(
            /[&<>"']/g,
            ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[ch]
        );
}


function formatMoney(value) {

    return Number(value || 0)
        .toLocaleString('zh-TW');
}


function renderRecentRequests(rows) {

    const container =
        document.getElementById('recent-requests');

    if (!rows.length) {

        container.innerHTML =
            '<div class="recent-empty">目前沒有採購申請</div>';

        return;
    }

    const recent = [...rows]
        .sort(
            (a, b) =>
                Number(b.id || 0) -
                Number(a.id || 0)
        )
        .slice(0, 5);

    container.innerHTML =
        recent.map(r => {

            const status =
                String(r.status || 'UNKNOWN')
                    .toUpperCase();

            return `
                <div class="recent-row">

                    <div class="recent-main">

                        <div class="recent-title">
                            #${escapeHtml(r.id)}
                            ${escapeHtml(r.item_name)}
                        </div>

                        <div class="recent-meta">
                            ${escapeHtml(r.applicant)}
                            ・ NT$${formatMoney(r.total_amount)}
                        </div>

                    </div>

                    <span class="recent-badge ${status}">
                        ${escapeHtml(status)}
                    </span>

                </div>
            `;
        })
        .join('');
}


function renderRequestGrowth(rows) {

    const container =
        document.getElementById('growth-bars');

    const subtitle =
        document.getElementById('growth-subtitle');

    if (!rows.length) {

        subtitle.textContent =
            '建立第一筆申請後，這裡會開始累積';

        container.innerHTML =
            '<div class="growth-empty">尚無資料</div>';

        return;
    }

    const dateKeys = [
        'created_at',
        'createdAt',
        'created',
        'timestamp'
    ];

    const dateKey =
        dateKeys.find(
            key => rows.some(r => r[key])
        );

    let points = [];

    if (dateKey) {

        const grouped = new Map();

        rows.forEach(r => {

            const date =
                new Date(r[dateKey]);

            if (Number.isNaN(date.getTime())) {
                return;
            }

            const key =
                date.toISOString().slice(0, 10);

            grouped.set(
                key,
                (grouped.get(key) || 0) + 1
            );
        });

        points = [...grouped.entries()]
            .sort(
                (a, b) =>
                    a[0].localeCompare(b[0])
            )
            .slice(-7)
            .map(
                ([date, count]) => ({
                    label:
                        date.slice(5)
                            .replace('-', '/'),

                    value: count,

                    display:
                        `${count} 筆`
                })
            );

        if (points.length) {

            subtitle.textContent =
                '依申請日期統計・最近 7 個資料日';
        }
    }

    /*
       Current MVP fallback:
       If the API has no timestamp field,
       use actual recent request amounts.
       We do not invent fake dates.
    */
    if (!points.length) {

        points = [...rows]
            .sort(
                (a, b) =>
                    Number(a.id || 0) -
                    Number(b.id || 0)
            )
            .slice(-7)
            .map(
                r => ({
                    label:
                        `#${r.id}`,

                    value:
                        Number(r.total_amount) || 0,

                    display:
                        `NT$${formatMoney(r.total_amount)}`
                })
            );

        subtitle.textContent =
            '最近 7 筆申請金額・目前 API 尚無時間欄位';
    }

    const maximum =
        Math.max(
            ...points.map(p => p.value),
            1
        );
    container.classList.toggle(
        'sparse',
        points.length <= 2
    );

    container.innerHTML =
        points.map(p => {

            const height =
                Math.max(
                    8,
                    Math.round(
                        (p.value / maximum) * 100
                    )
                );

            return `
                <div class="growth-col"
                     title="${escapeHtml(p.display)}">

                    <div class="growth-value">
                        ${escapeHtml(p.display)}
                    </div>

                    <div class="growth-track">

                        <div class="growth-bar"
                             style="height:${height}%">
                        </div>

                    </div>

                    <div class="growth-label">
                        ${escapeHtml(p.label)}
                    </div>

                </div>
            `;
        })
        .join('');
}

async function loadRequests() {

    const response = await fetch('/requests');
    const rows = await response.json();

    renderRequestGrowth(rows);
    renderRecentRequests(rows);

    document.getElementById('total').textContent =
        rows.length;

    document.getElementById('pending').textContent =
        rows.filter(r => r.status === 'PENDING').length;

    document.getElementById('approved').textContent =
        rows.filter(r => r.status === 'APPROVED').length;

    document.getElementById('rejected').textContent =
        rows.filter(r => r.status === 'REJECTED').length;

    const container =
        document.getElementById('requests');

    if (rows.length === 0) {
        container.innerHTML =
            '<div class="empty">目前沒有採購申請</div>';
        return;
    }

    container.innerHTML = rows.map(r => `

        <div class="request">

            <span class="amount">
                NT$${Number(r.total_amount).toLocaleString()}
            </span>

            <div class="title">
                #${r.id} ${r.item_name}
            </div>

            <div class="meta">
                申請人：${r.applicant}
                ・ 數量：${r.quantity}
            </div>

            <span class="status ${r.status}">
                ${r.status}
            </span>

            ${
                r.status === 'PENDING'
                ? `
                <div class="actions">

                    <button
                        class="approve"
                        onclick="decide(${r.id}, 'approve')">
                        核准
                    </button>

                    <button
                        class="reject"
                        onclick="decide(${r.id}, 'reject')">
                        駁回
                    </button>

                </div>
                `
                : ''
            }

        </div>

    `).join('');
}


async function decide(id, action) {

    const response = await fetch(
        `/requests/${id}/${action}`,
        { method: 'POST' }
    );

    if (!response.ok) {
        const data = await response.json();
        alert(data.detail || '狀態更新失敗');
        return;
    }

    await loadRequests();
}


document.getElementById('form')
.addEventListener('submit', async e => {

    e.preventDefault();

    const body = {
        applicant:
            document.getElementById('applicant').value,

        item_name:
            document.getElementById('item_name').value,

        quantity:
            Number(document.getElementById('quantity').value),

        unit_price:
            Number(document.getElementById('unit_price').value)
    };

    const response = await fetch('/requests', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
    });

    if (!response.ok) {
        alert('建立失敗');
        return;
    }

    document.getElementById('item_name').value = '';
    document.getElementById('unit_price').value = '';

    await loadRequests();
});


loadRequests();

</script>

</body>
</html>
