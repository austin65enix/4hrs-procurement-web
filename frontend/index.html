<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4HRS Procurement</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft JhengHei", sans-serif;
    background: #f3f5f7;
    color: #202124;
}

header {
    background: #17212b;
    color: white;
    padding: 26px 40px;
}

header h1 {
    margin: 0;
}

header p {
    margin: 6px 0 0;
    color: #b8c0c8;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    padding: 24px 40px 0;
}

.stat {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.stat .number {
    font-size: 30px;
    font-weight: bold;
    margin-top: 8px;
}

main {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 24px;
    padding: 24px 40px 40px;
}

.card {
    background: white;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    margin-top: 6px;
    padding: 11px;
    border: 1px solid #ccd1d5;
    border-radius: 7px;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 10px 16px;
    font-weight: bold;
    cursor: pointer;
}

.submit {
    margin-top: 22px;
    width: 100%;
    background: #2167d5;
    color: white;
}

.request {
    padding: 18px 0;
    border-bottom: 1px solid #e5e7eb;
}

.request:last-child {
    border-bottom: 0;
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.meta {
    color: #667085;
    margin-top: 6px;
}

.amount {
    float: right;
    font-weight: bold;
    font-size: 17px;
}

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 11px;
    border-radius: 16px;
    font-size: 13px;
    font-weight: bold;
}

.PENDING {
    background: #fff3cd;
    color: #856404;
}

.APPROVED {
    background: #d9f7e5;
    color: #176b38;
}

.REJECTED {
    background: #fde2e2;
    color: #9c1c1c;
}

.actions {
    margin-top: 12px;
}

.approve {
    background: #238636;
    color: white;
    margin-right: 8px;
}

.reject {
    background: #c62828;
    color: white;
}

.request-tools {
    margin: 14px 0 18px;
}

.request-filter-row {
    display: grid;
    grid-template-columns: 1fr 170px;
    gap: 10px;
}

.request-filter-row input,
.request-filter-row select {
    width: 100%;
    padding: 10px 11px;
    border: 1px solid #ccd1d5;
    border-radius: 7px;
    background: white;
}

.filter-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
}

#export-csv {
    background: #2167d5;
    color: white;
    padding: 8px 12px;
}
.filter-summary {
    margin-top: 8px;
    color: #667085;
    font-size: 13px;
}

@media (max-width: 650px) {
    .request-filter-row {
        grid-template-columns: 1fr;
    }
}
.detail-actions {
    margin-top: 10px;
}

.detail-toggle {
    background: #eef2f7;
    color: #344054;
    padding: 7px 12px;
}

.request-detail {
    margin-top: 12px;
    padding: 14px;
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 9px;
}

.detail-grid {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px 14px;
    font-size: 14px;
}

.detail-label {
    color: #667085;
    font-weight: bold;
}

.detail-value {
    color: #202124;
    word-break: break-word;
}
.empty {
    color: #777;
    padding: 20px 0;
}

@media (max-width: 800px) {
    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

    main {
        grid-template-columns: 1fr;
    }
}

/* =========================================================
   P03 Dashboard Enhancement
   ========================================================= */

.insights {
    width: min(1120px, calc(100% - 40px));
    margin: 0 auto 24px;
    display: grid;
    grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
    gap: 20px;
}

.insight-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    border: 1px solid #eef2f7;
}

.insight-heading {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 18px;
}

.insight-heading h2 {
    margin: 0;
    font-size: 20px;
}

.insight-subtitle {
    margin-top: 5px;
    color: #64748b;
    font-size: 13px;
}

.live-pill {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-radius: 999px;
    background: #eff6ff;
    color: #2563eb;
    font-size: 12px;
    font-weight: 700;
}

.growth-bars {
    height: 185px;
    display: flex;
    align-items: flex-end;
    gap: 10px;
}

.growth-col {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    text-align: center;
}

.growth-value {
    min-height: 28px;
    margin-bottom: 6px;
    color: #475569;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.growth-track {
    height: 125px;
    display: flex;
    align-items: flex-end;
    padding: 0 4px;
    background: linear-gradient(
        180deg,
        rgba(239, 246, 255, 0.15),
        rgba(239, 246, 255, 0.80)
    );
    border-radius: 10px;
}

.growth-bar {
    width: 100%;
    min-height: 8px;
    border-radius: 8px 8px 4px 4px;
    background: linear-gradient(
        180deg,
        #60a5fa 0%,
        #2563eb 100%
    );
    transition:
        height 0.35s ease,
        transform 0.2s ease;
}

.growth-col:hover .growth-bar {
    transform: translateY(-3px);
}

/* P03-R5 - sparse dataset presentation */
.growth-bars.sparse {
    justify-content: center;
}

.growth-bars.sparse .growth-col {
    flex: 0 1 140px;
    max-width: 140px;
}

.growth-bars.sparse .growth-track {
    width: 100%;
}
.growth-label {
    margin-top: 7px;
    color: #64748b;
    font-size: 11px;
}

.growth-empty,
.recent-empty {
    color: #94a3b8;
    font-size: 14px;
    padding: 24px 0;
}

.recent-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.recent-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #f1f5f9;
}

.recent-row:last-child {
    border-bottom: none;
}

.recent-main {
    min-width: 0;
}

.recent-title {
    color: #0f172a;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.recent-meta {
    margin-top: 3px;
    color: #64748b;
    font-size: 12px;
}

.recent-badge {
    flex: 0 0 auto;
    padding: 5px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.2px;
}

.recent-badge.PENDING {
    background: #fff7ed;
    color: #c2410c;
}

.recent-badge.APPROVED {
    background: #ecfdf5;
    color: #047857;
}

.recent-badge.REJECTED {
    background: #fef2f2;
    color: #b91c1c;
}

@media (max-width: 820px) {
    .insights {
        grid-template-columns: 1fr;
    }

    .growth-bars {
        gap: 6px;
    }

    .growth-value {
        font-size: 10px;
    }
}

/* P05-W1 - Procurement Workspace */

.workspace-nav {
    margin: 20px 28px 0;
    padding: 12px 16px;
    background: white;
    border-radius: 12px;
}

.workspace-nav-inner {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.workspace-tab {
    padding: 10px 18px;
    border: 1px solid #d7dee8;
    border-radius: 8px;
    background: #f8fafc;
    color: #334155;
    font-weight: 600;
    cursor: pointer;
}

.workspace-tab:hover {
    background: #edf4ff;
}

.workspace-tab.active {
    background: #2167d5;
    border-color: #2167d5;
    color: white;
}

.workspace-view {
    display: none;
}

.workspace-view.active {
    display: block;
}

main > .workspace-view {
    grid-column: 1 / -1;
}

.workspace-history-shell {
    background: white;
    border-radius: 12px;
    padding: 24px;
}

.workspace-history-shell p {
    color: #64748b;
}

@media (max-width: 760px) {

    .workspace-nav {
        margin-left: 16px;
        margin-right: 16px;
    }

    .workspace-tab {
        flex: 1 1 calc(50% - 8px);
    }
}


/* P05-W2 - History Workspace */

.history-summary {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 16px 0 18px;
}

.history-summary-item {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 10px 14px;
    color: #475569;
    font-size: 13px;
}

.history-summary-item strong {
    color: #0f172a;
    margin-left: 4px;
}

.history-list {
    display: grid;
    gap: 10px;
}

.history-item {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 14px 16px;
    background: #ffffff;
}

.history-item-header {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    align-items: flex-start;
}

.history-item-title {
    font-weight: 700;
    color: #0f172a;
}

.history-item-amount {
    font-weight: 700;
    white-space: nowrap;
}

.history-item-meta {
    margin-top: 6px;
    color: #64748b;
    font-size: 13px;
}

.history-item-footer {
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.history-date {
    color: #94a3b8;
    font-size: 12px;
}

.history-empty {
    padding: 24px;
    text-align: center;
    color: #64748b;
    background: #f8fafc;
    border-radius: 10px;
}


/* P05-W3 - Workflow Handoff */

/* P05-W4 - Timestamp Presentation */

.request-created-at {
    margin-top: 6px;
    color: #94a3b8;
    font-size: 12px;
}

.history-times {
    text-align: right;
    color: #94a3b8;
    font-size: 12px;
    line-height: 1.7;
}

.history-time-label {
    color: #64748b;
    margin-right: 6px;
}

@media (max-width: 760px) {

    .history-item-footer {
        align-items: flex-start;
        flex-direction: column;
    }

    .history-times {
        text-align: left;
    }
}


/* P05-W5-B - Decision Input */

.decision-dialog {
    width: min(520px, calc(100vw - 32px));
    border: 0;
    border-radius: 14px;
    padding: 0;
    box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.28);
}

.decision-dialog::backdrop {
    background: rgba(15, 23, 42, 0.48);
}

.decision-dialog-body {
    padding: 24px;
}

.decision-dialog h3 {
    margin: 0 0 6px;
}

.decision-context {
    color: #64748b;
    font-size: 13px;
    margin-bottom: 20px;
}

.decision-dialog label {
    display: block;
    margin: 14px 0 6px;
    font-weight: 600;
}

.decision-dialog input,
.decision-dialog textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font: inherit;
}

.decision-dialog textarea {
    min-height: 110px;
    resize: vertical;
}

.decision-dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.decision-cancel {
    background: #f1f5f9;
    color: #334155;
}

.decision-confirm.approve {
    background: #15803d;
    color: white;
}

.decision-confirm.reject {
    background: #dc2626;
    color: white;
}

</style>
</head>

<body>

<header>
<h1>4HRS Procurement</h1>
<p>採購申請管理系統</p>
</header>

<nav class="workspace-nav"
     aria-label="Procurement Workspace">

    <div class="workspace-nav-inner">

        <button type="button"
                class="workspace-tab active"
                data-workspace-target="dashboard">
            Dashboard
        </button>

        <button type="button"
                class="workspace-tab"
                data-workspace-target="new-request">
            New Request
        </button>

        <button type="button"
                class="workspace-tab"
                data-workspace-target="requests">
            Requests
        </button>

        <button type="button"
                class="workspace-tab"
                data-workspace-target="history">
            History
        </button>

    </div>

</nav>

<section
    id="workspace-dashboard"
    class="workspace-view active"
    data-workspace-view="dashboard">

<section class="dashboard">

<div class="stat">
    <div>總申請</div>
    <div id="total" class="number">0</div>
</div>

<div class="stat">
    <div>待審核</div>
    <div id="pending" class="number">0</div>
</div>

<div class="stat">
    <div>已核准</div>
    <div id="approved" class="number">0</div>
</div>

<div class="stat">
    <div>已駁回</div>
    <div id="rejected" class="number">0</div>
</div>

</section>

<section class="insights">

    <section class="insight-card">

        <div class="insight-heading">
            <div>
                <h2>Request Growth</h2>
                <div id="growth-subtitle"
                     class="insight-subtitle">
                    讀取申請資料中...
                </div>
            </div>

            <div class="live-pill">
                LIVE DATA
            </div>
        </div>

        <div id="growth-bars"
             class="growth-bars">
            <div class="growth-empty">
                載入資料中...
            </div>
        </div>

    </section>

    <section class="insight-card">

        <div class="insight-heading">
            <div>
                <h2>Recent Requests</h2>
                <div class="insight-subtitle">
                    最近 5 筆採購申請
                </div>
            </div>
        </div>

        <div id="recent-requests"
             class="recent-list">
            <div class="recent-empty">
                載入資料中...
            </div>
        </div>

    </section>

</section>

</section>

<main>

<section
    id="workspace-new-request"
    class="workspace-view"
    data-workspace-view="new-request">

<section class="card">

<h2>新增採購申請</h2>

<form id="form">

<label>申請人</label>
<input id="applicant" value="Austin" required>

<label>採購品項</label>
<input id="item_name"
       placeholder="例如：VAIO F14 32GB"
       required>

<label>數量</label>
<input id="quantity"
       type="number"
       value="1"
       min="1"
       required>

<label>單價</label>
<input id="unit_price"
       type="number"
       placeholder="46999"
       min="1"
       required>

<button class="submit" type="submit">
建立採購申請
</button>

</form>

</section>

</section>

<section
    id="workspace-requests"
    class="workspace-view"
    data-workspace-view="requests">

<section class="card">

<h2>採購申請</h2>

<div class="request-tools">

    <div class="request-filter-row">

        <input
            id="request-search"
            type="search"
            placeholder="搜尋 #編號、申請人、採購品項">

        <select id="status-filter">
            <option value="ALL">全部狀態</option>
            <option value="PENDING">待審核 PENDING</option>
            <option value="APPROVED">已核准 APPROVED</option>
            <option value="REJECTED">已駁回 REJECTED</option>
        </select>

    </div>

    <div class="filter-footer">

    <div id="filter-summary"
         class="filter-summary">
        載入中...
    </div>

    <button
        id="export-csv"
        type="button">
        匯出 CSV
    </button>

</div>

</div>

<div id="requests">
載入中...
</div>

</section>

</section>

<section
    id="workspace-history"
    class="workspace-view"
    data-workspace-view="history">

    <div class="workspace-history-shell">

        <h2>歷史資料</h2>

        <p>
            已核准與已駁回案件將在下一工序載入。
        </p>

        <div id="history-summary"
     class="history-summary">
</div>

<div id="history-list"
     class="history-list">
    載入歷史資料中...
</div>

    </div>

</section>

</main>

<dialog
    id="decision-dialog"
    class="decision-dialog">

    <form id="decision-form">

        <div class="decision-dialog-body">

            <h3 id="decision-title">
                審核決策
            </h3>

            <div
                id="decision-context"
                class="decision-context">
            </div>

            <label for="decision-actor">
                審核人
            </label>

            <input
                id="decision-actor"
                maxlength="100"
                value="Austin"
                required>

            <label for="decision-note">
                審核理由
            </label>

            <textarea
                id="decision-note"
                maxlength="500"
                placeholder="請輸入此次核准或駁回的理由"
                required></textarea>

            <div class="decision-dialog-actions">

                <button
                    id="decision-cancel"
                    class="decision-cancel"
                    type="button">
                    取消
                </button>

                <button
                    id="decision-confirm"
                    class="decision-confirm"
                    type="submit">
                    確認
                </button>

            </div>

        </div>

    </form>

</dialog>
<script>

function escapeHtml(value) {

    return String(value ?? '')
        .replace(
            /[&<>"']/g,
            ch => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[ch]
        );
}


function formatMoney(value) {

    return Number(value || 0)
        .toLocaleString('zh-TW');
}


function renderRecentRequests(rows) {

    const container =
        document.getElementById('recent-requests');

    if (!rows.length) {

        container.innerHTML =
            '<div class="recent-empty">目前沒有採購申請</div>';

        return;
    }

    const recent = [...rows]
        .sort(
            (a, b) =>
                Number(b.id || 0) -
                Number(a.id || 0)
        )
        .slice(0, 5);

    container.innerHTML =
        recent.map(r => {

            const status =
                String(r.status || 'UNKNOWN')
                    .toUpperCase();

            return `
                <div class="recent-row">

                    <div class="recent-main">

                        <div class="recent-title">
                            #${escapeHtml(r.id)}
                            ${escapeHtml(r.item_name)}
                        </div>

                        <div class="recent-meta">
                            ${escapeHtml(r.applicant)}
                            ・ NT$${formatMoney(r.total_amount)}
                        </div>

                    </div>

                    <span class="recent-badge ${status}">
                        ${escapeHtml(status)}
                    </span>

                </div>
            `;
        })
        .join('');
}


function renderRequestGrowth(rows) {

    const container =
        document.getElementById('growth-bars');

    const subtitle =
        document.getElementById('growth-subtitle');

    if (!rows.length) {

        subtitle.textContent =
            '建立第一筆申請後，這裡會開始累積';

        container.innerHTML =
            '<div class="growth-empty">尚無資料</div>';

        return;
    }

    const dateKeys = [
        'created_at',
        'createdAt',
        'created',
        'timestamp'
    ];

    const dateKey =
        dateKeys.find(
            key => rows.some(r => r[key])
        );

    let points = [];

    if (dateKey) {

        const grouped = new Map();

        rows.forEach(r => {

            const date =
                new Date(r[dateKey]);

            if (Number.isNaN(date.getTime())) {
                return;
            }

            const key =
                date.toISOString().slice(0, 10);

            grouped.set(
                key,
                (grouped.get(key) || 0) + 1
            );
        });

        points = [...grouped.entries()]
            .sort(
                (a, b) =>
                    a[0].localeCompare(b[0])
            )
            .slice(-7)
            .map(
                ([date, count]) => ({
                    label:
                        date.slice(5)
                            .replace('-', '/'),

                    value: count,

                    display:
                        `${count} 筆`
                })
            );

        if (points.length) {

            subtitle.textContent =
                '依申請日期統計・最近 7 個資料日';
        }
    }

    /*
       Current MVP fallback:
       If the API has no timestamp field,
       use actual recent request amounts.
       We do not invent fake dates.
    */
    if (!points.length) {

        points = [...rows]
            .sort(
                (a, b) =>
                    Number(a.id || 0) -
                    Number(b.id || 0)
            )
            .slice(-7)
            .map(
                r => ({
                    label:
                        `#${r.id}`,

                    value:
                        Number(r.total_amount) || 0,

                    display:
                        `NT$${formatMoney(r.total_amount)}`
                })
            );

        subtitle.textContent =
            '最近 7 筆申請金額・目前 API 尚無時間欄位';
    }

    const maximum =
        Math.max(
            ...points.map(p => p.value),
            1
        );
    container.classList.toggle(
        'sparse',
        points.length <= 2
    );

    container.innerHTML =
        points.map(p => {

            const height =
                Math.max(
                    8,
                    Math.round(
                        (p.value / maximum) * 100
                    )
                );

            return `
                <div class="growth-col"
                     title="${escapeHtml(p.display)}">

                    <div class="growth-value">
                        ${escapeHtml(p.display)}
                    </div>

                    <div class="growth-track">

                        <div class="growth-bar"
                             style="height:${height}%">
                        </div>

                    </div>

                    <div class="growth-label">
                        ${escapeHtml(p.label)}
                    </div>

                </div>
            `;
        })
        .join('');
}

let allRequests = [];


function getFilteredRequests() {

    const keyword =
        document
            .getElementById('request-search')
            .value
            .trim()
            .toLowerCase();

    const status =
        document
            .getElementById('status-filter')
            .value;

    return allRequests.filter(r => {

        const searchable = [
            `#${r.id}`,
            r.id,
            r.applicant,
            r.item_name,
            r.status
        ]
        .join(' ')
        .toLowerCase();

        const keywordMatch =
            !keyword ||
            searchable.includes(keyword);

        const statusMatch =
            status === 'ALL' ||
            r.status === status;

        return keywordMatch && statusMatch;
    });
}


function csvEscape(value) {

    const text =
        String(value ?? '');

    if (
        text.includes(',') ||
        text.includes('"') ||
        text.includes('\n')
    ) {
        return `"${text.replace(/"/g, '""')}"`;
    }

    return text;
}


function exportFilteredRequests() {

    const rows =
        getFilteredRequests();

    if (!rows.length) {
        alert('目前沒有可匯出的資料');
        return;
    }

    const header = [
        'id',
        'applicant',
        'item_name',
        'quantity',
        'unit_price',
        'total_amount',
        'status'
    ];

    const csvRows = [
        header.join(',')
    ];

    rows.forEach(r => {

        csvRows.push([
            r.id,
            r.applicant,
            r.item_name,
            r.quantity,
            r.unit_price,
            r.total_amount,
            r.status
        ]
        .map(csvEscape)
        .join(','));
    });

    const csv =
        '\uFEFF' + csvRows.join('\r\n');

    const blob =
        new Blob(
            [csv],
            {
                type:
                    'text/csv;charset=utf-8;'
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement('a');

    const stamp =
        new Date()
            .toISOString()
            .slice(0, 10);

    link.href = url;

    link.download =
        `4hrs-procurement-${stamp}.csv`;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);
}

function formatDateTime(value, fallback = '未記錄') {

    if (!value) {
        return fallback;
    }

    const date =
        new Date(value);

    if (Number.isNaN(date.getTime())) {
        return fallback;
    }

    return date.toLocaleString('zh-TW');
}

        panel.hidden = false;

function renderHistory(rows) {

    const historyRows =
        [...rows]
            .filter(r =>
                r.status === 'APPROVED' ||
                r.status === 'REJECTED'
            )
            .sort(
                (a, b) =>
                    Number(b.id) - Number(a.id)
            );


    const approvedCount =
        historyRows.filter(
            r => r.status === 'APPROVED'
        ).length;


    const rejectedCount =
        historyRows.filter(
            r => r.status === 'REJECTED'
        ).length;


    const summary =
        document.getElementById('history-summary');


    summary.innerHTML = `
        <div class="history-summary-item">
            已結案
            <strong>${historyRows.length}</strong>
        </div>

        <div class="history-summary-item">
            已核准
            <strong>${approvedCount}</strong>
        </div>

        <div class="history-summary-item">
            已駁回
            <strong>${rejectedCount}</strong>
        </div>
    `;


    const container =
        document.getElementById('history-list');


    if (!historyRows.length) {

        container.innerHTML = `
            <div class="history-empty">
                目前沒有已結案的採購申請
            </div>
        `;

        return;
    }


    container.innerHTML =
        historyRows.map(r => {

            const created =
                formatDateTime(
                    r.created_at,
                    '時間未提供'
                );

            const decided =
                formatDateTime(
                    r.decided_at,
                    '未記錄'
                );


            return `
                <div class="history-item">

                    <div class="history-item-header">

                        <div class="history-item-title">
                            #${escapeHtml(r.id)}
                            ${escapeHtml(r.item_name)}
                        </div>

                        <div class="history-item-amount">
                            NT$${Number(
                                r.total_amount
                            ).toLocaleString()}
                        </div>

                    </div>


                    <div class="history-item-meta">
                        申請人：
                        ${escapeHtml(r.applicant)}
                        ・ 數量：
                        ${escapeHtml(r.quantity)}
                    </div>


                    <div class="history-item-footer">

                        <span class="status ${r.status}">
                            ${escapeHtml(r.status)}
                        </span>

                        <div class="history-times">

                            <div>
                                <span class="history-time-label">
                                    申請時間
                                </span>
                                ${escapeHtml(created)}
                            </div>

                            <div>
                                <span class="history-time-label">
                                    審核時間
                                </span>
                                ${escapeHtml(decided)}
                            </div>

                        </div>

                    </div>

                </div>
            `;
        })
        .join('');
}

async function loadRequests() {

    const response =
        await fetch('/requests');

    const rows =
        await response.json();

    allRequests = rows;

    renderRequestGrowth(rows);
    renderRecentRequests(rows);
    renderHistory(rows);

    document.getElementById('total').textContent =
        rows.length;

    document.getElementById('pending').textContent =
        rows.filter(
            r => r.status === 'PENDING'
        ).length;

    document.getElementById('approved').textContent =
        rows.filter(
            r => r.status === 'APPROVED'
        ).length;

    document.getElementById('rejected').textContent =
        rows.filter(
            r => r.status === 'REJECTED'
        ).length;

    renderRequestList();
}


let pendingDecision = null;


function openDecisionDialog(id, action) {

    const request =
        allRequests.find(
            r => Number(r.id) === Number(id)
        );

    if (!request) {
        alert('找不到採購申請');
        return;
    }


    pendingDecision = {
        id,
        action
    };


    const isApprove =
        action === 'approve';


    document.getElementById(
        'decision-title'
    ).textContent =
        isApprove
            ? '核准採購申請'
            : '駁回採購申請';


    document.getElementById(
        'decision-context'
    ).textContent =
        `#${request.id} ${request.item_name}`;


    const confirmButton =
        document.getElementById(
            'decision-confirm'
        );


    confirmButton.textContent =
        isApprove
            ? '確認核准'
            : '確認駁回';


    confirmButton.classList.remove(
        'approve',
        'reject'
    );

    confirmButton.classList.add(
        isApprove
            ? 'approve'
            : 'reject'
    );


    document.getElementById(
        'decision-note'
    ).value = '';


    const actor =
        document.getElementById(
            'decision-actor'
        );

    if (!actor.value.trim()) {
        actor.value = 'Austin';
    }


    document.getElementById(
        'decision-dialog'
    ).showModal();


    actor.focus();
}


async function submitDecision() {

    if (!pendingDecision) {
        return;
    }


    const decidedBy =
        document.getElementById(
            'decision-actor'
        ).value.trim();


    const decisionNote =
        document.getElementById(
            'decision-note'
        ).value.trim();


    if (!decidedBy) {
        alert('請輸入審核人');
        return;
    }


    if (!decisionNote) {
        alert('請輸入審核理由');
        return;
    }


    const response =
        await fetch(
            `/requests/${pendingDecision.id}/${pendingDecision.action}`,
            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json'
                },

                body: JSON.stringify({
                    decided_by: decidedBy,
                    decision_note: decisionNote
                })
            }
        );


    if (!response.ok) {

        const data =
            await response.json();

        alert(
            data.detail ||
            '審核決策寫入失敗'
        );

        return;
    }


    document.getElementById(
        'decision-dialog'
    ).close();


    pendingDecision = null;


    await loadRequests();

    showWorkspace('requests');
}


document.getElementById(
    'decision-form'
).addEventListener(
    'submit',
    async event => {

        event.preventDefault();

        await submitDecision();
    }
);


document.getElementById(
    'decision-cancel'
).addEventListener(

    () => {

        pendingDecision = null;

        document.getElementById(
            'decision-dialog'
        ).close();
    }
);


document.getElementById(

).addEventListener(

    }
);

function showWorkspace(name) {

    document
        .querySelectorAll('[data-workspace-view]')
        .forEach(view => {

            view.classList.toggle(
                'active',
                view.dataset.workspaceView === name
            );
        });


    document
        .querySelectorAll('[data-workspace-target]')
        .forEach(button => {

            button.classList.toggle(
                'active',
                button.dataset.workspaceTarget === name
            );
        });


    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}


document
    .querySelectorAll('[data-workspace-target]')
    .forEach(button => {

        button.addEventListener(
            'click',
            () => showWorkspace(
                button.dataset.workspaceTarget
            )
        );
    });


showWorkspace('dashboard');

loadRequests();
